name: V1 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python 3.13 — preflight and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # CI placeholders only.
      # These are NOT real Shopify credentials and main.py is not run.
      SHOPIFY_STORE_DOMAIN: example.myshopify.com
      SHOPIFY_CLIENT_ID: ci-placeholder-client-id
      SHOPIFY_CLIENT_SECRET: ci-placeholder-client-secret
      SHOPIFY_API_VERSION: 2026-07
      LOW_INVENTORY_THRESHOLD: "5"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run V1 preflight
        run: python scripts/preflight.py --ci

      - name: Compile Python source
        run: >
          python -m compileall
          application
          config
          database
          presentation
          repositories
          services
          shopify
          scripts
          main.py
          tests

      - name: Run automated tests
        run: python -m pytest -q
